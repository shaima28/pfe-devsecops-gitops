apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketing-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shaima28/pfe-devsecops-gitops.git
    targetRevision: main
    path: apps/marketing-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: marketing-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true