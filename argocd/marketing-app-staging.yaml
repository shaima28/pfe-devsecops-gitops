apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketing-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shaima28/pfe-devsecops-gitops.git
    targetRevision: main
    path: apps/marketing-app/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: marketing-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true