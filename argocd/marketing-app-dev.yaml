apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketing-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TON-USERNAME/pfe-devsecops-gitops.git
    targetRevision: main
    path: apps/marketing-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: marketing-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true