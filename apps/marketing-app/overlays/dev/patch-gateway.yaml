apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: marketing-app-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - pfechaima.duckdns.org
      tls:
        httpsRedirect: true

    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - pfechaima.duckdns.org
      tls:
        mode: SIMPLE
        credentialName: pfechaima-tls